name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Permite lanzarlo manualmente desde la web

permissions:
  contents: read

jobs:
  build:
    name: Build APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      JAVA_VERSION: '17'
      ANDROID_API_LEVEL: '34'
      ANDROID_NDK_VERSION: '27.0.12077973'
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"

    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Android SDK (manual - más fiable)
      - name: Setup Android SDK
        run: |
          # Install cmdline-tools
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip

          # Accept licenses and install components
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          # Add to PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      # 5. Cache de dependencias (acelera builds siguientes)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 6. Instalar dependencias npm
      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      # 7. Generar código nativo (prebuild) - IMPORTANTE para Expo
      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean --no-install

      # 8. Dar permisos de ejecución a gradlew
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 9. Build APK (debug - para probar) y AAB (release - para Play Store)
      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Build Release AAB
        run: cd android && ./gradlew bundleRelease --no-daemon

      # 10. Subir APK como artifact (descargable desde la web de GitHub)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: beat-vortex-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: beat-vortex-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # 11. (Opcional) Crear Release automático si es tag
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true